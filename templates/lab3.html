{% extends "base.html" %}
{% block content %}
<div class="card border-danger">
  <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
    <span>Lab 3: Private Medical / Security Notes (Hashed Token)</span>
    <span class="badge bg-dark">URL Param: ?token={{ current_token }}</span>
  </div>
  <div class="card-body">
    {% if note %}
      <h4>{{ note.title }}</h4>
      <div class="p-3 bg-light rounded border mt-3">
        <strong>Stored Secret:</strong>
        <p class="mb-0 font-monospace text-primary">{{ note.secret_content }}</p>
      </div>
    {% else %}
      <div class="alert alert-warning">Token invalid or note expired.</div>
    {% endif %}
  </div>
</div>
{% endblock %}
